<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Run Time Calculator</title>

    <style>
        /* ==========================================================
           ОСНОВА
           ========================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            font-family: Arial, sans-serif;

            background: #111;
            color: #eee;
        }


        /* ==========================================================
           КАЛЬКУЛЯТОР
           ========================================================== */

        .calculator {
            width: 100%;
            max-width: 1150px;

            padding: 30px;

            background: #181818;
            border: 1px solid #292929;
            border-radius: 16px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }


        /* ==========================================================
           ЗАГОЛОВОК
           ========================================================== */

        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            margin: 0 0 7px;

            font-size: 25px;
            font-weight: 600;

            color: #fff;
        }

        .header p {
            margin: 0;

            font-size: 14px;
            color: #777;
        }


        /* ==========================================================
           ТРИ КОЛОНКИ
           ========================================================== */

        .columns {
            display: grid;

            grid-template-columns:
                1fr
                1fr
                1.35fr;

            gap: 16px;
        }


        /* ==========================================================
           КОЛОНКА
           ========================================================== */

        .column {
            min-width: 0;

            padding: 20px;

            background: #1e1e1e;

            border: 1px solid #292929;
            border-radius: 12px;
        }

        .column-title {
            margin-bottom: 18px;

            font-size: 14px;
            font-weight: 600;

            color: #aaa;
        }


        /* ==========================================================
           ПОЛЯ
           ========================================================== */

        .field {
            margin-bottom: 12px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            color: #777;
        }

        .field input {
            width: 100%;

            padding: 11px 12px;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;

            background: #111;
            color: #fff;

            font-family: monospace;
            font-size: 15px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .field input:focus {
            border-color: #555;
            background: #141414;
        }


        /* ==========================================================
           РЕЗУЛЬТАТЫ
           ========================================================== */

        .result {
            padding: 14px;

            margin-bottom: 12px;

            background: #151515;

            border: 1px solid #292929;
            border-radius: 8px;
        }

        .result:last-child {
            margin-bottom: 0;
        }

        .result-label {
            margin-bottom: 7px;

            font-size: 12px;
            color: #777;
        }

        .result-value {
            font-family: monospace;

            font-size: 21px;
            font-weight: 600;

            color: #ddd;
        }


        /* ==========================================================
           ГЛАВНЫЙ РЕЗУЛЬТАТ
           ========================================================== */

        .result.main {
            padding: 17px;

            background: #222;
            border-color: #3a3a3a;
        }

        .result.main .result-label {
            color: #999;
        }

        .result.main .result-value {
            font-size: 29px;
            color: #fff;
        }


        /* ==========================================================
           FRAME RATE
           ========================================================== */

        .fps-field {
            margin-bottom: 18px;
        }

        .fps-field label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            color: #777;
        }

        .fps-field input {
            width: 100%;

            padding: 11px 12px;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;

            background: #111;
            color: #fff;

            font-family: monospace;
            font-size: 15px;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .fps-field input:focus {
            border-color: #555;
            background: #141414;
        }


        /* ==========================================================
           MOD NOTE
           ========================================================== */

        .mod-note {
            display: flex;
            flex-direction: column;
        }

        .mod-note-label {
            margin-bottom: 7px;

            font-size: 12px;
            color: #777;
        }

        .mod-note textarea {
            width: 100%;
            min-height: 150px;

            padding: 12px;

            resize: vertical;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;

            background: #111;
            color: #ddd;

            font-family: monospace;
            font-size: 13px;
            line-height: 1.5;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .mod-note textarea:focus {
            border-color: #555;
            background: #141414;
        }


        /* ==========================================================
           КНОПКА КОПИРОВАНИЯ
           ========================================================== */

        .copy-button {
            width: 100%;

            margin-top: 10px;

            padding: 11px 16px;

            border: 1px solid #333;
            border-radius: 7px;

            background: #252525;
            color: #ccc;

            font-size: 13px;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .copy-button:hover {
            background: #2d2d2d;
            border-color: #444;
        }

        .copy-button:active {
            background: #202020;
        }


        /* ==========================================================
           НИЖНЯЯ ЧАСТЬ
           ========================================================== */

        .bottom {
            display: flex;
            flex-direction: column;

            margin-top: 18px;
        }


        /* ==========================================================
           ОШИБКА
           ========================================================== */

        .error {
            min-height: 18px;

            margin-top: 16px;

            font-size: 13px;
            color: #999;

            text-align: center;
        }


        /* ==========================================================
           КНОПКА СБРОСА
           ========================================================== */

        .reset-button {
            width: 100%;

            padding: 11px 16px;

            border: 1px solid #303030;
            border-radius: 8px;

            background: #222;
            color: #bbb;

            font-size: 13px;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .reset-button:hover {
            background: #292929;
            border-color: #3b3b3b;
        }

        .reset-button:active {
            background: #1d1d1d;
        }


        /* ==========================================================
           ПОДСКАЗКА
           ========================================================== */

        .hint {
            margin-top: 18px;

            font-size: 11px;

            color: #555;

            text-align: center;
        }


        /* ==========================================================
           АДАПТИВНОСТЬ
           ========================================================== */

        @media (max-width: 900px) {

            .columns {
                grid-template-columns: 1fr 1fr;
            }

            .column:last-child {
                grid-column: 1 / -1;
            }
        }


        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .calculator {
                padding: 20px;
            }

            .columns {
                grid-template-columns: 1fr;
            }

            .column:last-child {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <main class="calculator">

        <!-- ======================================================
             ЗАГОЛОВОК
             ====================================================== -->

        <div class="header">

            <h1>Run Time Calculator</h1>

            <p>
                Расчёт времени забега по временным меткам видео
            </p>

        </div>


        <!-- ======================================================
             ТРИ КОЛОНКИ
             ====================================================== -->

        <div class="columns">


            <!-- ==================================================
                 КОЛОНКА 1 — ИСХОДНЫЕ ДАННЫЕ
                 ================================================== -->

            <section class="column">

                <div class="column-title">
                    Исходные данные
                </div>


                <div class="field">

                    <label for="videoStart">
                        Начало видео
                    </label>

                    <input
                        id="videoStart"
                        type="text"
                        value="0:00:00.000"
                        placeholder="0:00:00.000"
                        autocomplete="off"
                    >

                </div>


                <div class="field">

                    <label for="runStart">
                        Начало забега
                    </label>

                    <input
                        id="runStart"
                        type="text"
                        value="0:00:21.937"
                        placeholder="0:00:00.000"
                        autocomplete="off"
                    >

                </div>


                <div class="field">

                    <label for="runEnd">
                        Конец забега
                    </label>

                    <input
                        id="runEnd"
                        type="text"
                        value="0:05:03.033"
                        placeholder="0:00:00.000"
                        autocomplete="off"
                    >

                </div>


                <div class="field">

                    <label for="videoEnd">
                        Конец видео
                    </label>

                    <input
                        id="videoEnd"
                        type="text"
                        value="0:10:25.834"
                        placeholder="0:00:00.000"
                        autocomplete="off"
                    >

                </div>

            </section>


            <!-- ==================================================
                 КОЛОНКА 2 — РЕЗУЛЬТАТ
                 ================================================== -->

            <section class="column">

                <div class="column-title">
                    Результат
                </div>


                <div class="result">

                    <div class="result-label">
                        До начала забега
                    </div>

                    <div
                        class="result-value"
                        id="beforeRun"
                    >
                        0:00:21.937
                    </div>

                </div>


                <div class="result main">

                    <div class="result-label">
                        Время забега
                    </div>

                    <div
                        class="result-value"
                        id="runTime"
                    >
                        0:04:41.096
                    </div>

                </div>


                <div class="result">

                    <div class="result-label">
                        После забега
                    </div>

                    <div
                        class="result-value"
                        id="afterRun"
                    >
                        0:05:22.801
                    </div>

                </div>


                <div class="result">

                    <div class="result-label">
                        Полная продолжительность видео
                    </div>

                    <div
                        class="result-value"
                        id="videoTime"
                    >
                        0:10:25.834
                    </div>

                </div>

            </section>


            <!-- ==================================================
                 КОЛОНКА 3 — MOD NOTE
                 ================================================== -->

            <section class="column">

                <div class="column-title">
                    Mod Note
                </div>


                <div class="fps-field">

                    <label for="videoFps">
                        Frame Rate
                    </label>

                    <input
                        id="videoFps"
                        type="number"
                        value="60"
                        min="1"
                        step="0.001"
                        placeholder="60"
                    >

                </div>


                <div class="mod-note">

                    <div class="mod-note-label">
                        Готовая заметка
                    </div>

                    <textarea
                        id="modNote"
                        readonly
                    >Mod Note: Start Time: 0:00:21.937, End Time: 0:05:03.033, Frame Rate: 60, Time: 0:04:41.096</textarea>

                    <button
                        class="copy-button"
                        id="copyButton"
                    >
                        Копировать
                    </button>

                </div>

            </section>

        </div>


        <!-- ======================================================
             НИЖНЯЯ ЧАСТЬ
             ====================================================== -->

        <div class="bottom">

            <div
                class="error"
                id="error"
            ></div>


            <button
                class="reset-button"
                id="resetButton"
            >
                Сбросить значения
            </button>


            <div class="hint">
                Формат времени: ч:мм:сс.мс
            </div>

        </div>

    </main>


    <script>

        /* ==========================================================
           ЭЛЕМЕНТЫ
           ========================================================== */

        const videoStartInput =
            document.getElementById("videoStart");

        const runStartInput =
            document.getElementById("runStart");

        const runEndInput =
            document.getElementById("runEnd");

        const videoEndInput =
            document.getElementById("videoEnd");

        const videoFpsInput =
            document.getElementById("videoFps");


        const beforeRunOutput =
            document.getElementById("beforeRun");

        const runTimeOutput =
            document.getElementById("runTime");

        const afterRunOutput =
            document.getElementById("afterRun");

        const videoTimeOutput =
            document.getElementById("videoTime");


        const modNoteOutput =
            document.getElementById("modNote");


        const errorOutput =
            document.getElementById("error");


        const resetButton =
            document.getElementById("resetButton");

        const copyButton =
            document.getElementById("copyButton");


        /* ==========================================================
           ВРЕМЯ → МИЛЛИСЕКУНДЫ
           ========================================================== */

        function parseTime(value) {

            value = value.trim();

            const match = value.match(
                /^(\d+):([0-5]\d):([0-5]\d)\.(\d{1,3})$/
            );

            if (!match) {
                return null;
            }


            const hours =
                Number(match[1]);

            const minutes =
                Number(match[2]);

            const seconds =
                Number(match[3]);


            let milliseconds =
                Number(match[4]);


            if (match[4].length === 1) {
                milliseconds *= 100;
            }

            if (match[4].length === 2) {
                milliseconds *= 10;
            }


            return (
                hours * 3600000 +
                minutes * 60000 +
                seconds * 1000 +
                milliseconds
            );
        }


        /* ==========================================================
           МИЛЛИСЕКУНДЫ → ВРЕМЯ
           ========================================================== */

        function formatTime(milliseconds) {

            milliseconds =
                Math.round(milliseconds);


            const hours =
                Math.floor(milliseconds / 3600000);

            milliseconds %= 3600000;


            const minutes =
                Math.floor(milliseconds / 60000);

            milliseconds %= 60000;


            const seconds =
                Math.floor(milliseconds / 1000);

            milliseconds %= 1000;


            return (
                hours +
                ":" +
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0") +
                "." +
                String(milliseconds).padStart(3, "0")
            );
        }


        /* ==========================================================
           ОБНОВЛЕНИЕ MOD NOTE
           ========================================================== */

        function updateModNote(
            startTime,
            endTime,
            videoFps,
            videoTime
        ) {

            modNoteOutput.value =
                `Mod Note: Start Time: ${startTime}, End Time: ${endTime}, Frame Rate: ${videoFps}, Time: ${videoTime}`;
        }


        /* ==========================================================
           РАСЧЁТ
           ========================================================== */

        function calculate() {

            errorOutput.textContent = "";


            const videoStart =
                parseTime(videoStartInput.value);

            const runStart =
                parseTime(runStartInput.value);

            const runEnd =
                parseTime(runEndInput.value);

            const videoEnd =
                parseTime(videoEndInput.value);


            const videoFps =
                videoFpsInput.value.trim();


            /* ------------------------------------------------------
               ПРОВЕРКА ВРЕМЕНИ
               ------------------------------------------------------ */

            if (
                videoStart === null ||
                runStart === null ||
                runEnd === null ||
                videoEnd === null
            ) {

                errorOutput.textContent =
                    "Проверь формат времени.";

                return;
            }


            /* ------------------------------------------------------
               ПРОВЕРКА ПОРЯДКА
               ------------------------------------------------------ */

            if (runStart < videoStart) {

                errorOutput.textContent =
                    "Начало забега раньше начала видео.";

                return;
            }


            if (runEnd < runStart) {

                errorOutput.textContent =
                    "Конец забега раньше его начала.";

                return;
            }


            if (videoEnd < runEnd) {

                errorOutput.textContent =
                    "Конец видео раньше конца забега.";

                return;
            }


            /* ------------------------------------------------------
               ПРОВЕРКА FPS
               ------------------------------------------------------ */

            if (
                videoFps === "" ||
                Number(videoFps) <= 0
            ) {

                errorOutput.textContent =
                    "Укажи корректный Frame Rate.";

                return;
            }


            /* ------------------------------------------------------
               РАСЧЁТЫ
               ------------------------------------------------------ */

            const beforeRun =
                runStart - videoStart;

            const runTime =
                runEnd - runStart;

            const afterRun =
                videoEnd - runEnd;

            const videoTime =
                videoEnd - videoStart;


            /* ------------------------------------------------------
               ФОРМАТИРОВАНИЕ
               ------------------------------------------------------ */

            const formattedBeforeRun =
                formatTime(beforeRun);

            const formattedRunTime =
                formatTime(runTime);

            const formattedAfterRun =
                formatTime(afterRun);

            const formattedVideoTime =
                formatTime(videoTime);


            /* ------------------------------------------------------
               ВЫВОД РЕЗУЛЬТАТОВ
               ------------------------------------------------------ */

            beforeRunOutput.textContent =
                formattedBeforeRun;

            runTimeOutput.textContent =
                formattedRunTime;

            afterRunOutput.textContent =
                formattedAfterRun;

            videoTimeOutput.textContent =
                formattedVideoTime;


            /* ------------------------------------------------------
               MOD NOTE
               ------------------------------------------------------ */

            updateModNote(
                runStartInput.value.trim(),
                runEndInput.value.trim(),
                videoFps,
                formattedRunTime
            );
        }


        /* ==========================================================
           АВТОМАТИЧЕСКИЙ РАСЧЁТ
           ========================================================== */

        const inputs = [
            videoStartInput,
            runStartInput,
            runEndInput,
            videoEndInput,
            videoFpsInput
        ];


        inputs.forEach(input => {

            input.addEventListener(
                "input",
                calculate
            );

            input.addEventListener(
                "change",
                calculate
            );

        });


        /* ==========================================================
           КОПИРОВАНИЕ MOD NOTE
           ========================================================== */

        copyButton.addEventListener(
            "click",
            async () => {

                try {

                    await navigator.clipboard.writeText(
                        modNoteOutput.value
                    );

                    copyButton.textContent =
                        "Скопировано!";

                    setTimeout(() => {

                        copyButton.textContent =
                            "Копировать";

                    }, 1200);

                } catch (error) {

                    modNoteOutput.select();

                    document.execCommand("copy");

                    copyButton.textContent =
                        "Скопировано!";

                    setTimeout(() => {

                        copyButton.textContent =
                            "Копировать";

                    }, 1200);
                }
            }
        );


        /* ==========================================================
           СБРОС
           ========================================================== */

        resetButton.addEventListener(
            "click",
            () => {

                videoStartInput.value =
                    "0:00:00.000";

                runStartInput.value =
                    "0:00:00.000";

                runEndInput.value =
                    "0:00:00.000";

                videoEndInput.value =
                    "0:00:00.000";

                videoFpsInput.value =
                    "60";


                calculate();
            }
        );


        /* ==========================================================
           ПЕРВОНАЧАЛЬНЫЙ РАСЧЁТ
           ========================================================== */

        calculate();

    </script>

</body>
</html>
